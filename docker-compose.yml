# Full stack: Postgres-backed audit chain, gateway API, dashboard.
#   API_TOKEN=$(openssl rand -hex 24) docker compose up --build
# Then open http://localhost:8080 and paste the token into "Set token".
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinel
      API_TOKEN: ${API_TOKEN:?set API_TOKEN, e.g. API_TOKEN=$(openssl rand -hex 24)}
      FRONTEND_ORIGIN: http://localhost:8080
      # Demo affordances stay on unless you opt into strict mode.
      SENTINEL_MODE: ${SENTINEL_MODE:-demo}
      ENABLE_TAMPER_DEMO: ${ENABLE_TAMPER_DEMO:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
